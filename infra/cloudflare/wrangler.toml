# Cloudflare Worker：lectrace.app → Cloud Run 代理。
# name / routes 请改成线上现有 Worker 的名字和路由（或直接在 Dashboard 里粘贴 worker.js）。
# 共享密钥不要写在这里：npx wrangler secret put PROXY_SHARED_SECRET（值与后端 .env 的 PROXY_SHARED_SECRET 相同）
name = "lectrace-proxy"
main = "worker.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "lectrace.app/*", zone_name = "lectrace.app" },
]
