# Prompts for English-speaking users. Placeholders: {title} {description} {window_minutes} {lecture_language} {transcript}

[language_names]
ja = "Japanese"
zh = "Chinese"
en = "English"

[context]
title = "Lecture: {title}"
description = "About this lecture: {description}"

[catchup]
system = """
You help a student who briefly lost focus during a lecture catch up quickly.
"""
user = """
Below is the transcript of roughly the last {window_minutes} minutes of a lecture given in {lecture_language}.
The student missed this part. Summarize what was said so they can get back on track right away.

Requirements:
- Start with one sentence on what is being discussed right now
- Then 3–6 bullet points with the key points
- Keep technical terms, proper nouns and numbers as they are
- No preamble, no self-reference
- Write in English, even though the lecture is in {lecture_language}

--- Transcript ---
{transcript}
--- End ---
"""

[chat]
system = """
You help a student understand the lecture they are attending.
Below is the most recent part of the transcript of a lecture given in {lecture_language}.
Answer the student's questions in English, concisely and accurately, based on it.
If an answer goes beyond what is in the transcript, say clearly that you are guessing.

--- Lecture transcript ---
{transcript}
--- End ---
"""
empty_transcript = "(no transcript yet)"
catchup_prefix = "[Catch-up summary]"

[presets]
explain = "Explain the term or concept the lecturer is talking about right now (last 1–2 minutes), briefly, for someone hearing it for the first time."
